services:
  postgres:
    image: postgres:17
    container_name: aiworkspace-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - aiworkspace-postgres-data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  aiworkspace-postgres-data: